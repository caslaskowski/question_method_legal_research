name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install pandoc
        # From pandoc's own release files, not the Ubuntu package mirrors: the mirrors' name lookups
        # were failing on the runner and taking the whole check down with them.
        uses: pandoc/actions/setup@v1
        with: { version: "3.1.3" }
      - name: Site builds cleanly on a fresh machine
        run: python3 build.py
      - name: Committed site is current with its sources
        # build.py records a hash of every input in build-manifest.json; this fails if content/,
        # book.json, assets/ or the hand-made downloads changed after the last committed build.
        # (Byte-comparing the output does not work: pandoc versions and DOCX timestamps differ.)
        run: |
          git checkout -- . 2>/dev/null || true
          git clean -fdq
          python3 build.py --check
